name: Keep Supabase awake

# Supabase pauses free projects after about a week without activity.
# This reads one row from the Mellemrum (case 1) database every other day so the
# deployed case 1 solution keeps working while the exam is being graded.

on:
  schedule:
    - cron: "0 8 */2 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/keep-supabase-awake.yml

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one event from Supabase
        env:
          SUPABASE_URL: https://hpnvclrrczdvmfvyiynf.supabase.co
          # Publishable key: designed to be public and already shipped in the deployed site.
          SUPABASE_KEY: sb_publishable_k45_YtNAsJO56MnoOGxMUg_lGt_4L-Q
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/events?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY"
